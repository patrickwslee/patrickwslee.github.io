<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Stock Dashboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #121212;
      color: #f0f0f0;
      font-family: sans-serif;
      display: flex;
      overflow: hidden;
    }
    #chart-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 10px;
      padding: 10px;
      overflow-y: auto;
    }
    .chart-box {
      width: 100%;
      height: 300px;
      background-color: #1e1e1e;
      border-radius: 4px;
      overflow: hidden;
    }
    .chart-container {
      width: 100%;
      height: 100%;
    }
    #sidebar {
      width: 300px;
      background-color: #1f1f1f;
      padding: 10px;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #333;
      overflow-y: auto;
    }
    #stock-input {
      display: flex;
      margin-bottom: 10px;
    }
    #stock-input input {
      flex: 1;
      padding: 5px;
      margin-right: 5px;
      border: none;
      border-radius: 4px;
    }
    #stock-input button {
      padding: 5px 10px;
      border: none;
      background-color: #4caf50;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
  <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
  <div id="chart-grid"></div>
  <div id="sidebar">
    <div id="stock-input">
      <input type="text" id="new-stock" placeholder="Add symbol (e.g., AAPL)" />
      <button onclick="addStock()">Add</button>
    </div>
    <div id="market-widget"></div>
  </div>

  <script>
    let stocks = JSON.parse(localStorage.getItem('stocks') || '[]');

    function renderStocks() {
      const grid = document.getElementById('chart-grid');
      grid.innerHTML = '';

      stocks.forEach((symbol, idx) => {
        const box = document.createElement('div');
        box.className = 'chart-box';
        const cont = document.createElement('div');
        cont.id = `tv_chart_${idx}`;
        cont.className = 'chart-container';
        box.appendChild(cont);
        grid.appendChild(box);

        new TradingView.widget({
          autosize: true,
          symbol: symbol.includes(':') ? symbol : `NASDAQ:${symbol}`,
          interval: 'D',
          timezone: 'Etc/UTC',
          theme: 'dark',
          style: '1',
          hide_top_toolbar: true,
          enable_publishing: false,
          withdateranges: true,
          allow_symbol_change: true,
          container_id: cont.id
        });
      });

      renderMarketWidget();
    }

    function renderMarketWidget() {
      const widgetContainer = document.getElementById('market-widget');
      widgetContainer.innerHTML = '';

      const widgetScript = document.createElement('script');
      widgetScript.type = 'text/javascript';
      widgetScript.async = true;
      widgetScript.src = 'https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js';
      widgetScript.innerHTML = JSON.stringify({
        colorTheme: "dark",
        dateRange: "12M",
        showChart: true,
        locale: "en",
        width: "100%",
        height: "400",
        largeChartUrl: "",
        isTransparent: false,
        showSymbolLogo: true,
        plotLineColorGrowing: "#00ff00",
        plotLineColorFalling: "#ff0000",
        gridLineColor: "rgba(240, 243, 250, 0.06)",
        scaleFontColor: "rgba(120, 123, 134, 1)",
        belowLineFillColorGrowing: "rgba(0, 255, 0, 0.12)",
        belowLineFillColorFalling: "rgba(255, 0, 0, 0.12)",
        symbolActiveColor: "rgba(242, 250, 254, 0.12)",
        tabs: [
          {
            title: "My Stocks",
            symbols: stocks.map(s => ({ s: s.includes(':') ? s : `NASDAQ:${s}` })),
            originalTitle: "My Stocks"
          }
        ]
      });
      widgetContainer.appendChild(widgetScript);
    }

    function addStock() {
      const input = document.getElementById('new-stock');
      const symbol = input.value.trim().toUpperCase();
      if (symbol && !stocks.includes(symbol)) {
        stocks.push(symbol);
        localStorage.setItem('stocks', JSON.stringify(stocks));
        renderStocks();
      }
      input.value = '';
    }

    renderStocks();
  </script>
</body>
</html>
