<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi-Chart Dashboard</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #121212;
      color: #f0f0f0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
    }
    #chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 10px;
      padding: 10px;
      flex: 1;
    }
    .chart-box {
      width: 100%;
      height: 300px;
      background-color: #1e1e1e;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .chart-container {
      width: 100%;
      height: 100%;
    }
    #ticker-tape {
      width: 100%;
    }
  </style>
  <!-- TradingView Widget script -->
  <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
  <div id="chart-grid"></div>
  <div id="ticker-tape"></div>

  <script>
    const params = new URLSearchParams(window.location.search);

    // Load chart symbols from ?symbols=
    const symbols = (params.get('symbols') || '')
      .split(',')
      .map(s => s.trim().toUpperCase())
      .filter(s => s);

    const grid = document.getElementById('chart-grid');

    symbols.forEach((sym, idx) => {
      const box = document.createElement('div');
      box.className = 'chart-box';

      const cont = document.createElement('div');
      cont.id = `tv_chart_${idx}`;
      cont.className = 'chart-container';
      box.appendChild(cont);
      grid.appendChild(box);

      new TradingView.widget({
        autosize: true,
        symbol: sym.includes(':') ? sym : `NASDAQ:${sym}`,
        interval: 'D',
        timezone: 'Etc/UTC',
        theme: 'dark',
        style: '1',
        toolbar_bg: '#2a2a2a',
        hide_top_toolbar: true,
        enable_publishing: false,
        withdateranges: true,
        allow_symbol_change: true,
        container_id: cont.id
      });
    });

    if (symbols.length === 0) {
      grid.innerHTML = '<p style="padding:20px; text-align:center; color:#888;">No symbols provided. Add ?symbols=AAPL,MSFT to the URL.</p>';
    }

    // Load ticker tape symbols from ?ticker=
    const tickerSymbols = (params.get('ticker') || '')
      .split(',')
      .map(s => s.trim().toUpperCase())
      .filter(s => s);

    if (tickerSymbols.length > 0) {
      const widgetScript = document.createElement('script');
      widgetScript.type = 'text/javascript';
      widgetScript.async = true;
      widgetScript.src = 'https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';

      const config = {
        symbols: tickerSymbols.map(s => ({ proName: s.includes(':') ? s : `NASDAQ:${s}`, title: s })),
        showSymbolLogo: true,
        colorTheme: 'dark',
        isTransparent: false,
        displayMode: 'regular',
        locale: 'en'
      };

      widgetScript.innerHTML = JSON.stringify(config);

      const tickerContainer = document.createElement('div');
      tickerContainer.className = 'tradingview-widget-container';
      const widgetDiv = document.createElement('div');
      widgetDiv.className = 'tradingview-widget-container__widget';
      tickerContainer.appendChild(widgetDiv);
      tickerContainer.appendChild(widgetScript);

      document.getElementById('ticker-tape').appendChild(tickerContainer);
    }
  </script>
</body>
</html>
